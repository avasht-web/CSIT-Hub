{% extends "layout.html" %}

{% block content %}
<h2>Welcome back {{ session.get('username') }}!</h2>
<h3>Here's your study overview.</h3>

<section class="cards">
    <div class="card">
        <h3 align="center">Tasks</h3>
        <p align="center">1</p>
    </div>
    <div class="card">
        <h3 align="center">Notes</h3>
        <p align="center">2</p>
    </div>
</section> 

<div>
    <h3>Quick Actions</h3>
</div>

<section class="crd">
    <a href="/tasks" class="cr">
        <h3>Add Task</h3> 
        <i class='bx bx-chevron-right'></i>
    </a>
    <a href="/notes" class="cr">
        <h3>Add Note</h3> 
        <i class='bx bx-chevron-right'></i>
    </a>
    <a href="/schedule" class="cr">
        <h3>View Calendar</h3> 
        <i class='bx bx-chevron-right'></i>
    </a>
</section>
{% endblock %}

<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1.0">
      <title>CSIT HUB</title>
      <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
      <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
   </head>
   <body>
    <div class="container">
      <header class="Navbar">
         <img src="{{ url_for('static', filename='CSITHublogo.png') }}" class="logo" height="80">
         <nav class="Student">
            <ul>
               <li>Student</li>
            </ul>
         </nav>
      </header>
      <aside class="Sidebar">
         <a href="#" class="sb"> 
             <img src="{{ url_for('static', filename='csithub.png') }}" class="sbl" height="80">
         </a>
         <ul>
            <li><i class='bx bx-home'></i> <a href="/" class="dashboard">Dashboard</a></li>
            <li><i class='bx bx-check-square'></i> <a href="/tasks" class="tasks">Tasks</a></li>
            <li><i class='bx bx-edit-alt'></i> <a href="#" class="notes">Notes</a></li>
            <li><i class='bx bx-book-open'></i> <a href="#" class="subjects">Subjects</a></li>
            <li><i class='bx bx-calendar'></i> <a href="#" class="schedule">Schedule</a></li>
         </ul>
      </aside>
      <main class="Maincontent">
         {% block content %}
         {% endblock %} 
      </main>    
    </div>
    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
   </body>
</html>

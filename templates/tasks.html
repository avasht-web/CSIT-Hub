{% extends "layout.html" %}
{% block content %}
<div style="padding: 20px;">
    <h2>CSIT HUB</h2>
    <div class="note-form-container">
        <form action="/tasks" method="post" style="display: flex; gap: 15px;">
            <input type="text" name="task" placeholder="Add Task" required style="flex-grow: 1; padding: 10px; border: none; border-radius: 5px; font-family: inherit;">
            <button type="submit" class="btn-submit">Confirm</button>
        </form>
    </div>
    <hr style="border: 0; border-top: 1px solid #ccc; margin: 30px 0; max-width: 700px;">
    <div class="notes-list">
        <h3 style="margin-top: 0; color: #1e293b;">Tasks</h3>
        {% for task in tasks %}
        <div class="note-card" style="align-items: center; padding: 15px 20px;">
            <form action="/tasks/toggle/{{task['id']}}" method="post" style="margin: 0; display: flex; align-items: center; gap: 15px;">
                <input type="checkbox" onchange="this.form.submit()" {% if task['completed'] %}checked{% endif %} style="transform: scale(1.3); cursor: pointer; margin: 0;">
                <span style="font-size: 16px; {% if task['completed'] %}text-decoration: line-through; color: #94a3b8;{% else %}color: #1e293b;{% endif %}">
                    {{task['title']}}
                </span>
            </form>
            <form action="/tasks/delete/{{task['id']}}" method="post" style="margin: 0;">
                <button type="submit" class="btn-delete">Delete</button>
            </form>
        </div>
        {% endfor %}  
    </div>
</div>
{% endblock %}

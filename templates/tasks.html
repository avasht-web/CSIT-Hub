<html>
  <meta charset="utf-8">
   <meta name="viewport" content="width=device-wodth,initial-scale=1.0">
<body>
<h1>CSIT HUB</h1>
<p>Tasks</p>
<form action="#" method="post">
<input type="text" name="task" placeholder="Add Task" id="t"><button type="submit" id="btn1">Confirm</button>
</form>
 <hr>
<div>
{% for task in tasks %}
<form action="/tasks/toggle/{{task['id']}}" method="post">
    <br><input type="checkbox" onchange="this.form.submit()" {% if task['completed'] %}checked{% endif %} > {{task['title']}}
    </form>
    <form action="/tasks/delete/{{task['id']}}" method="post">
    <button type="submit" id="Delete">Delete</button>
  </form>
{% endfor %}  
</div>

</body>
<script>
  const btn = document.getElementById("btn1");
  btn.addEventListener("click", fetc);
  function fetc(event) {
    event.preventDefault(); 
    
    const input = document.getElementById("t");
    const task = input.value;
    
    const data = new FormData();
    data.append("task", task);
    
    fetch("/tasks", { 
      method: "POST",
      body: data
    }).then(() => {
      location.reload(); 
    });
  }
</script>

</html>
